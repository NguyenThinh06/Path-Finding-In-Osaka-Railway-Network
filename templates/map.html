<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🚇 Osaka Railway Pathfinder</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="map"></div>

<div id="panel">
    <div id="panel-header">
        <div class="title">Osaka Railway</div>
    </div>
    <div id="panel-body">
        <div>
            <div class="label">Mode</div>
            <select id="actionSelect">
                <option value="FindPath">🔍 Find Path</option>
                <option value="SetupMap">⚙️  Setup Map</option>
            </select>
        </div>

        <div>
            <div class="label">Algorithm</div>
            <select id="algorithmSelect">
                <option value="A Star">A* (A-Star)</option>
                <option value="Dijkstra">Dijkstra</option>
                <option value="UCS">UCS</option>
                <option value="Greedy BFS">Greedy BFS</option>
            </select>
        </div>

        <div class="divider"></div>

        <div>
            <div class="label">Layers</div>
            <button id="toggleNodes" class="btn"><span class="icon">🔴</span> Toggle Stations</button>
            <div style="height:6px"></div>
            <button id="togglePaths" class="btn"><span class="icon">╌</span> Toggle Routes</button>
        </div>

        <div id="setup-section">
            <div class="divider"></div>
            <div class="label">Setup Action</div>
            <select id="setupActionSelect">
                <option value="DeletePath">Delete One-Way Path</option>
                <option value="DeletePathBoth">Delete Two-Way Path</option>
                <option value="SetTraficjam">Set Traffic Jam ×5</option>
            </select>
            <div style="height:6px"></div>
            <button id="Setup" class="btn danger"><span class="icon">⚡</span> Apply Action</button>
        </div>

        <div class="divider"></div>

        <div style="font-size:9px; color:var(--muted); line-height:1.7; font-family:var(--font-jp)">
            <span id="hint-text">Click map twice to select start → end</span>
        </div>
    </div>
</div>

<div id="mode-badge" class="find">FIND PATH</div>

<div id="stats">
    <div class="stat-title">▶ Path Result</div>
    <div class="row"><span class="key">Algorithm</span><span class="val accent" id="s-algo">—</span></div>
    <div class="row"><span class="key">Distance</span><span class="val gold" id="s-dist">—</span></div>
    <div class="row"><span class="key">Nodes in path</span><span class="val" id="s-nodes">—</span></div>
    <div class="row"><span class="key">Nodes expanded</span><span class="val teal" id="s-expanded">—</span></div>
    <div class="row"><span class="key">Time</span><span class="val" id="s-time">—</span></div>
</div>

<div id="statusbar">
    <div class="dot"></div>
    <span id="status-text">Ready — click on the map to set start point</span>
    <span id="coord-display" style="color:#3a4060; font-size:9px"></span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Template variables from Flask
    const node_coords = {{ node_coords|tojson|safe }};
    const railway_coords = {{ railway_coords|tojson|safe }};
    const station_labels = {{ station_labels|tojson|safe }};
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
